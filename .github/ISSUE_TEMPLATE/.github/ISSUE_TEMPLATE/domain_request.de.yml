name: "🌐 Domain-Wunsch"
description: "Wünsche dir eine neue Internetseite für deine Whitelist!"
title: "[Wunsch]: "
labels: ["child-request"]
body:
  - type: input
    id: domain
    attributes:
      label: "Welche Internetseite möchtest du besuchen?"
      description: "Trage hier die Adresse ein (z.B. beispiel.de)."
      placeholder: "beispiel.de"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Wofür brauchst du die Seite?"
      description: "Erzähl kurz, warum die Seite wichtig ist (z.B. für die Schule oder zum Lernen)."
      placeholder: "Für mein Projekt über..."
    validations:
      required: true
